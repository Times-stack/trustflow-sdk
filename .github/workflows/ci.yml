name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run test typecheck
        run: npm run typecheck:tests

      - name: Check examples typecheck
        run: npm run examples:check

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check public API documentation coverage
        run: npm run check-docs

      - name: Restore Jest cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .jest-cache
          key: jest-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'jest.config.js') }}

      - name: Run tests
        if: matrix.node-version != '22.x'
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage
          path: coverage/

      - name: Build package
        run: npm run build

      - name: Check published package types
        run: npm run typecheck:published

      - name: Build documentation
        run: npm run docs

      - name: Check API documentation coverage
        run: npm run check-docs

      - name: Check build artifacts
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.mjs || exit 1
          test -f dist/index.d.ts || exit 1
          echo "✓ All build artifacts present"

      - name: Enforce bundle size limits
        run: npm run size

      - name: Verify tree-shaking
        run: npm run treeshake:check

  hooks-react:
    name: Hook tests (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        react-version: [18, 19]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install React ${{ matrix.react-version }}
        run: >
          npm install --no-save --ignore-scripts
          react@${{ matrix.react-version }}
          react-dom@${{ matrix.react-version }}
          @types/react@${{ matrix.react-version }}
          @types/react-dom@${{ matrix.react-version }}

      - name: Run hook tests
        run: npx jest tests/hooks.test.ts tests/use-

  browser:
    name: Browser compat (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run browser-safe suites under jsdom
        run: npx jest tests/utils-extended.test.ts tests/logger.test.ts --env=jsdom

  e2e:
    name: End-to-end (local Stellar network)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Stellar quickstart (local mode)
        run: docker run --rm -d -p 8000:8000 --name stellar stellar/quickstart:latest --local

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Show quickstart logs on failure
        if: failure()
        run: docker logs stellar

  deploy-docs:
    name: Publish API Reference (GitHub Pages)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/reference

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
